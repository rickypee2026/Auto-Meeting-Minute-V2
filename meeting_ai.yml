name: 🤖 Meeting AI Automation

# 設定觸發條件
on:
  # 允許你在 GitHub 網頁上手動點擊執行
  workflow_dispatch: 
  # （選用）設定定時排程，例如每天 UTC 時間 10:00 (台灣時間 18:00) 執行
  # schedule:
  #   - cron: '0 10 * * *'

jobs:
  process_meeting:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 取出你的程式碼
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 安裝套件
    - name: Install dependencies
      run: pip install -r requirements.txt

    # 4. 執行核心程式，並將 GitHub Secrets 注入為環境變數
    - name: Run AI Meeting Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: python main.py
